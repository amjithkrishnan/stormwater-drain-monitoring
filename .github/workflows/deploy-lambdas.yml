name: Deploy Lambdas and Dashboard

# Runs on every push to main. Instead of storing AWS credentials as
# GitHub secrets (which kept breaking since AWS Academy Learner Lab
# credentials expire every few hours), this SSHes into the EC2 box and
# runs the deploy there, reusing whatever AWS CLI credentials are
# already configured on the instance (~/.aws/credentials). That means
# the only thing that needs refreshing when the Lab session rotates is
# `aws configure` on EC2 itself - not a GitHub secret as well.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pull latest code and redeploy on EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/stormwater-project
            git pull origin main

            echo "--- Deploying Lambda functions ---"
            zip -j function-ingest.zip lambda_ingest.py
            aws lambda update-function-code \
              --function-name IngestStormwaterData \
              --zip-file fileb://function-ingest.zip \
              --region us-east-1

            zip -j function-proxy.zip lambda_ingest_proxy.py
            aws lambda update-function-code \
              --function-name IngestProxy \
              --zip-file fileb://function-proxy.zip \
              --region us-east-1

            zip -j function-get.zip lambda_get.py
            aws lambda update-function-code \
              --function-name GetStormwaterData \
              --zip-file fileb://function-get.zip \
              --region us-east-1

            echo "--- Rebuilding and deploying dashboard ---"
            cd stormwater-dashboard
            npm install
            npm run build
            sudo cp -r dist/* /var/www/html/
            sudo systemctl restart nginx

            echo "--- Deploy complete ---"

