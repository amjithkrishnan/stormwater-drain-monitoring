name: Deploy Lambdas and Dashboard

# Runs whenever a Lambda source file or the dashboard source changes on
# main. Lambda changes redeploy via the AWS CLI; dashboard changes get
# rebuilt and pushed to the EC2 box via SSH.
on:
  push:
    branches: [main]
    paths:
      - "lambda_ingest.py"
      - "lambda_ingest_proxy.py"
      - "lambda_get.py"
      - "stormwater-dashboard/**"
      - ".github/workflows/deploy-lambdas.yml"

jobs:
  deploy-lambdas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - file: lambda_ingest.py
            function_name: IngestStormwaterData
          - file: lambda_ingest_proxy.py
            function_name: IngestProxy
          - file: lambda_get.py
            function_name: GetStormwaterData

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Zip and deploy ${{ matrix.function_name }}
        run: |
          zip function.zip ${{ matrix.file }}
          aws lambda update-function-code \
            --function-name ${{ matrix.function_name }} \
            --zip-file fileb://function.zip

  deploy-dashboard:
    runs-on: ubuntu-latest
    # Only bother running this job if dashboard files actually changed,
    # since the Lambda job's matrix already covers the Lambda files.
    if: contains(github.event.head_commit.modified, 'stormwater-dashboard') || contains(github.event.head_commit.added, 'stormwater-dashboard')
    steps:
      - name: Build and deploy dashboard on EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/stormwater-project
            git pull origin main
            cd stormwater-dashboard
            npm install
            npm run build
            sudo cp -r dist/* /var/www/html/
            sudo systemctl restart nginx

